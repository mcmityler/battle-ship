<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <title>Battleship</title>
  </head>
  <body>
    <div class="game-container">
      <div class="main-title-container">
        <i class="fa-solid fa-ship"></i>
        <h1>Battleship</h1>
      </div>
      <!-- LEFT SIDEBAR (BOAT SUMMARY) -->
      <div class="left-sidebar-container">
        <div class="boat-summary-container">
          <p class="boat-summary">Boat Summary</p>
          <div class="boat-item">
            <div class="boat-status carrier-status"></div>
            <p>Carrier</p>
          </div>
          <div class="boat-item">
            <div class="boat-status battleship-status"></div>
            <p>Battleship</p>
          </div>
          <div class="boat-item">
            <div class="boat-status cruiser-status"></div>
            <p>Cruiser</p>
          </div>
          <div class="boat-item">
            <div class="boat-status submarine-status"></div>
            <p>Submarine</p>
          </div>
          <div class="boat-item">
            <div class="boat-status destroyer-status"></div>
            <p>Destroyer</p>
          </div>
        </div>
        <div class="legend-boat-summary">
          <p class="legend-title">Legend</p>
          <div class="summary-item">
            <div class="boat-status boat-available"></div>
            <p>Available</p>
          </div>
          <div class="summary-item">
            <div class="boat-status boat-hurt"></div>
            <p>Has been hit</p>
          </div>
          <div class="summary-item">
            <div class="boat-status boat-sunk"></div>
            <p>Has been sunk</p>
          </div>
        </div>
      </div>
      <!-- GAME SCREEN -->
      <div class="gameboard-container">
        <div class="ship-grid-wrapper">
          <p class="player-ships">Your Ships</p>
          <div class="ship-grid-container"></div>
        </div>
        <div class="shot-grid-wrapper">
          <p class="player-shots">Your Shots</p>
          <div class="shot-grid-container"></div>
        </div>
      </div>
      <!-- RIGHT SIDE BAR (CHANGE TURNS / RANDOMIZE BOATS)-->
      <div class="right-sidebar-container">
        <button class="turn-change-button">Change Turns</button>
        <p class="current-turn">Player _ Turn</p>
      </div>
    </div>
    <dialog id="new-game-dialog" open>
      <div class="dialog-container">
        <form id="new-game-form">
          <div class="dialog-title-container">
            <i class="fa-solid fa-ship"></i>
            <h2>Battleship</h2>
          </div>
          <div class="p1-container input-container">
            <input
              type="text"
              name="p1-input"
              id="p1-input"
              placeholder=""
              maxlength="26"
              autocomplete="off"
            />
            <label for="p1-input" class="hover-pointer">Player 1 Name: </label>
          </div>
          <div class="submit-checkbox">
            <input
              class="tgl tgl-flip"
              type="checkbox"
              name="computer-input"
              id="computer-input"
            />
            <label
              class="tgl-btn"
              data-tg-off="P.V.P."
              data-tg-on="Computer"
              for="computer-input"
            ></label>
          </div>
          <div class="p2-container input-container">
            <input
              type="text"
              name="p2-input"
              id="p2-input"
              placeholder=""
              maxlength="26"
              autocomplete="off"
            />
            <label for="p2-input" class="hover-pointer">Player 2 Name: </label>
          </div>
          <div class="difficulty-container">
            <div class="difficulty-inputs">
              <label for="easy-difficulty">
                <input
                  type="radio"
                  name="difficulty-selector"
                  id="easy-difficulty"
                  value="easy"
                  checked
                />
                <span class="name">Easy</span>
              </label>
              <label for="hard-difficulty">
                <input
                  type="radio"
                  name="difficulty-selector"
                  id="hard-difficulty"
                  value="hard"
                />
                <span class="name">Hard</span>
              </label>
            </div>
          </div>
          <div class="start-button-container">
            <button class="start-game-button hover-pointer">Start Game</button>
          </div>
        </form>
        <!-- <button class="close-dialog-button hover-pointer" aria-label="Close">
          <i class="fa-solid fa-x"></i> REMOVE THIS BUT I WANT THE LiBRARY POSSIBLY IN THE GAME TO USE 
        </button> -->
      </div>
    </dialog>
  </body>
</html>
